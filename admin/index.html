<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ออลไทย · เว็บใส่ข้อมูล</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Mitr:wght@500;600&amp;display=swap">
<style>
html, body { height: 100%; margin: 0; }
/* เว็บใส่ข้อมูล (admin). Desktop-first, same palette as the game. Every rule is scoped to #admin-app or an ad- class
   so the preview page can hold both sites at once. */
:root {
  --paper: #FBF8F2; --ink: #211E1A; --muted: #6E675D; --line: #E6DED0; --card: #FFFFFF;
  --rice: #2F6B3B; --rice-deep: #24532E; --rice-soft: #E4EFE5; --amber: #D99A2B; --amber-ink: #8F5512;
  --sea: #DCE8EE; --sea-line: #C3D5DD; --bad: #B4452F;
  --font-display: 'Mitr', 'IBM Plex Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, sans-serif;
}
#admin-app { position: fixed; inset: 0; overflow-y: auto; background: #F2EDE3; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; z-index: 50; -webkit-text-size-adjust: 100%; }
#admin-app[hidden] { display: none; }
#admin-app *, #admin-app *::before, #admin-app *::after { box-sizing: border-box; }
#admin-app h1, #admin-app h2, #admin-app h3, #admin-app h4 { font-family: var(--font-display); font-weight: 600; margin: 0; line-height: 1.25; }
#admin-app h2 { font-size: 24px; } #admin-app h3 { font-size: 18px; } #admin-app h4 { font-size: 15.5px; font-weight: 500; }
#admin-app p { margin: 0; }
#admin-app button, #admin-app input, #admin-app select, #admin-app textarea { font: inherit; color: inherit; }
#admin-app button { cursor: pointer; }
#admin-app :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
#admin-app [hidden] { display: none !important; }
.ad-muted { color: var(--muted); }
.ad-small { font-size: 13.5px; }
.ad-num { font-variant-numeric: tabular-nums; }

/* top bar */
.ad-top { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1.5px solid var(--line); }
.ad-top-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ad-brand { display: flex; align-items: center; gap: 10px; }
.ad-logo { width: 36px; height: 36px; border-radius: 11px; background: var(--rice); display: grid; place-items: center; }
.ad-brand b { font-family: var(--font-display); font-weight: 600; font-size: 22px; }
.ad-brand span { color: var(--muted); }
.ad-mode { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: #FBEBD0; color: var(--amber-ink); white-space: nowrap; }
.ad-mode.live { background: var(--rice-soft); color: var(--rice-deep); }
.ad-tabs { display: flex; gap: 4px; background: #EFE8DC; border-radius: 14px; padding: 4px; flex-wrap: wrap; }
.ad-tabs button { border: 0; background: transparent; border-radius: 10px; padding: 7px 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ad-tabs button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.ad-count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--amber); color: #fff; font-size: 12.5px; font-weight: 600; text-align: center; line-height: 20px; }
.ad-user { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 14px; }

/* layout */
.ad-main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 80px; display: flex; flex-direction: column; gap: 16px; }
.ad-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ad-head p { color: var(--muted); }
.ad-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.ad-note { background: #FBF3E3; border: 1.5px solid #F0DDB8; border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #5E4A25; }
.ad-note ol, .ad-note ul { margin: 6px 0 0; padding-left: 20px; }
.ad-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ad-bar .grow { flex: 1 1 200px; }
.ad-bar > .ad-in { width: auto; flex: 0 0 auto; }
.ad-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ad-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ad-stack { display: flex; flex-direction: column; gap: 12px; }

/* controls */
.ad-btn { min-height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; padding: 7px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; transition: background .12s; }
.ad-btn:hover { background: #FAF7F1; }
.ad-btn.primary { background: var(--rice); border-color: var(--rice); color: #fff; font-weight: 600; }
.ad-btn.primary:hover { background: var(--rice-deep); }
.ad-btn.ok { color: var(--rice-deep); border-color: #B7D2BC; background: var(--rice-soft); font-weight: 600; }
.ad-btn.danger { color: var(--bad); border-color: #EBC9BF; }
.ad-btn:disabled { opacity: .5; cursor: not-allowed; }
.ad-btn.sm { min-height: 32px; padding: 3px 10px; font-size: 14px; border-radius: 10px; }
.ad-link { background: none; border: 0; color: var(--rice-deep); text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.ad-in { width: 100%; min-height: 40px; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; }
textarea.ad-in { min-height: 76px; resize: vertical; line-height: 1.5; }
select.ad-in { padding-right: 6px; }
.ad-in.sm { min-height: 32px; padding: 3px 6px; font-size: 14px; border-radius: 8px; }
.ad-in:invalid, .ad-in.bad { border-color: #E2A595; }
.ad-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ad-field > label, .ad-label { font-size: 13.5px; color: var(--muted); }
.ad-help { font-size: 12.5px; color: var(--muted); }
.ad-err { font-size: 13px; color: var(--bad); }
.ad-check { display: inline-flex; align-items: center; gap: 8px; }
.ad-check input { width: 18px; height: 18px; accent-color: var(--rice); }
.ad-seg { display: inline-flex; background: #EFE8DC; border-radius: 12px; padding: 3px; flex-wrap: wrap; }
.ad-seg button { border: 0; background: transparent; border-radius: 9px; padding: 5px 12px; color: var(--muted); }
.ad-seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

/* chips */
.ad-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; background: #EFE8DC; color: var(--muted); }
.ad-chip.pub, .ad-chip.approved { background: var(--rice-soft); color: var(--rice-deep); }
.ad-chip.warn, .ad-chip.pending { background: #FBEBD0; color: var(--amber-ink); }
.ad-chip.bad, .ad-chip.rejected { background: #F6DED8; color: var(--bad); }
.ad-chip.today { background: var(--sea); color: #2E5566; }

/* submissions */
.ad-subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.ad-sub { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
.ad-sub .ph { display: block; width: 100%; aspect-ratio: 4 / 3; background: #EDE5D7; border: 0; padding: 0; cursor: zoom-in; position: relative; }
.ad-sub .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad-sub .ph .ad-chip { position: absolute; left: 10px; top: 10px; }
.ad-sub .bd { padding: 12px 14px 0; display: flex; flex-direction: column; gap: 6px; }
.ad-sub h3 { font-size: 18px; }
.ad-kv { font-size: 13.5px; color: var(--muted); }
.ad-kv b { color: var(--ink); font-weight: 500; }
.ad-desc { font-size: 14.5px; white-space: pre-wrap; }
.ad-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding: 12px 14px 14px; }
.ad-empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.ad-noimg { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 14px; }

/* tables */
.ad-scroll { overflow-x: auto; }
.ad-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.ad-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
.ad-table td { padding: 9px 8px; border-bottom: 1px solid #F0E9DD; vertical-align: middle; }
.ad-table tr:last-child td { border-bottom: 0; }
.ad-table tr.click { cursor: pointer; }
.ad-table tr.click:hover td { background: #FAF7F1; }
.ad-table tr.dirty td { background: #FFF8EA; }
.ad-table code { font-size: 13px; color: var(--muted); }
.ad-prov td, .ad-prov th { padding-left: 5px; padding-right: 5px; }
.ad-prov select.ad-in { min-width: 92px; }
.ad-prov td.t { min-width: 176px; }
.ad-prov td.o2 { min-width: 190px; }
.ad-prov td.nm { min-width: 118px; }
.ad-prov td.nm .ad-btn { margin-top: 4px; }
.ad-prov td.o1 select.ad-in { min-width: 116px; }

/* coverage */
.ad-cov { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ad-cov .ad-card { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.ad-cov.one { grid-template-columns: minmax(0, 560px); }
.ad-cov b { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ad-meter { position: relative; height: 8px; border-radius: 4px; background: #EFE8DC; overflow: hidden; }
.ad-meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rice); border-radius: 4px; }
.ad-meter s { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
details.ad-card > summary { cursor: pointer; font-family: var(--font-display); font-weight: 500; }
.ad-days { margin-top: 10px; }
.ad-days td:first-child { white-space: nowrap; color: var(--muted); }

/* editor */
.ad-ed { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.ad-ed-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ad-aside { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 12px; }
.ad-sec { display: flex; flex-direction: column; gap: 12px; }
.ad-sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ad-img { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; }
.ad-frame { aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #EDE5D7; border: 0; padding: 0; width: 100%; }
.ad-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ad-row { display: grid; gap: 8px; align-items: start; }
.ad-row.hint { grid-template-columns: minmax(0, 1fr) 170px; }
.ad-row.sim { grid-template-columns: 200px 110px minmax(0, 1fr) auto; }
.ad-row.fact { grid-template-columns: 210px minmax(0, 1fr) auto; }
.ad-row.src { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
.ad-x { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); background: #fff; color: var(--muted); display: grid; place-items: center; }
.ad-x:hover { color: var(--bad); border-color: #EBC9BF; }
.ad-profile { font-size: 13.5px; background: #F5F1E8; border-radius: 10px; padding: 8px 10px; color: #4E473D; }
.ad-ref { font-size: 14px; background: var(--sea); border-radius: 10px; padding: 10px 12px; color: #2E4954; white-space: pre-wrap; }
.ad-checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.ad-checks li { display: flex; gap: 8px; align-items: baseline; }
.ad-checks li::before { content: '✕'; color: var(--bad); font-weight: 700; width: 14px; flex: none; }
.ad-checks li.ok::before { content: '✓'; color: var(--rice); }
.ad-status { display: flex; flex-direction: column; gap: 6px; }
.ad-status label { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
.ad-status label.dis { opacity: .55; cursor: not-allowed; }
.ad-status input { accent-color: var(--rice); }
.ad-verify { display: flex; flex-direction: column; gap: 8px; }
.ad-verify.done { background: var(--rice-soft); border-radius: 12px; padding: 10px 12px; color: var(--rice-deep); }
.ad-tog { border: 1.5px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 13px; background: #fff; color: var(--muted); }
.ad-tog.on { background: var(--rice-soft); border-color: #B7D2BC; color: var(--rice-deep); }
.ad-togs { display: flex; flex-wrap: wrap; gap: 4px; }
.ad-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ad-picks button { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 0; overflow: hidden; text-align: left; }
.ad-picks img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.ad-picks span { display: block; padding: 6px 8px; font-size: 13px; }

/* dialog + toast */
.ad-dialog-bg { position: fixed; inset: 0; background: rgba(33,30,26,.45); display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
.ad-dialog-bg.on { display: flex; }
.ad-dialog { background: var(--paper); border-radius: 18px; padding: 20px; width: min(600px, 100%); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.ad-dialog.wide { width: min(920px, 100%); }
.ad-dialog .btns { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.ad-dialog .big { width: 100%; max-height: 72vh; object-fit: contain; border-radius: 12px; background: #1E1B17; }
.ad-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14.5px; z-index: 70; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
.ad-toast.on { opacity: .95; }
.ad-login { max-width: 420px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 980px) {
  .ad-ed { grid-template-columns: 1fr; }
  .ad-aside { position: static; }
}
@media (max-width: 760px) {
  .ad-grid2, .ad-grid3 { grid-template-columns: 1fr; }
  .ad-cov { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad-img { grid-template-columns: 1fr; }
  .ad-row.hint, .ad-row.fact, .ad-row.src { grid-template-columns: 1fr; }
  .ad-row.sim { grid-template-columns: 1fr 100px; }
  .ad-user { margin-left: 0; }
  .ad-top { position: static; }
  .ad-aside { top: 0; }
  .ad-main { padding: 14px 12px 80px; }
}
@media (prefers-reduced-motion: reduce) { #admin-app *, .ad-toast { transition: none !important; } }

</style>
</head>
<body>
<div id="admin-app" hidden>
  <header class="ad-top">
    <div class="ad-top-in">
      <div class="ad-brand">
        <span class="ad-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11.2A6.5 6.5 0 0 1 12 3.3a6.5 6.5 0 0 1 6.5 6.5C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.5"/></g></svg></span>
        <b>ออลไทย</b><span>เว็บใส่ข้อมูล</span>
      </div>
      <span class="ad-mode" id="ad-mode"></span>
      <nav class="ad-tabs" id="ad-tabs" aria-label="ส่วนของเว็บใส่ข้อมูล" hidden>
        <button type="button" data-view="subs">ภาพจากผู้เล่น <span class="ad-count" id="ad-sub-count" hidden></span></button>
        <button type="button" data-view="questions">คำถาม</button>
        <button type="button" data-view="system">ระบบ</button>
      </nav>
      <div class="ad-user">
        <span id="ad-email"></span>
        <button type="button" class="ad-link" id="ad-signout" hidden>ออกจากระบบ</button>
        <a class="ad-btn sm" id="ad-play" href="#">เปิดเว็บเล่นเกม</a>
      </div>
    </div>
  </header>
  <main class="ad-main" id="ad-main"><p class="ad-muted">กำลังโหลด…</p></main>
  <div class="ad-dialog-bg" id="ad-dialog-bg"><div class="ad-dialog" id="ad-dialog" role="dialog" aria-modal="true" aria-labelledby="ad-dialog-title"></div></div>
  <div class="ad-toast" id="ad-toast" role="status" aria-live="polite"></div>
</div>

<script src="config.js"></script>
<script>
// scoring.js — pure functions shared by the pages and the Node tests. V2: one category, answers are districts.
//
// score = round(base × h)
//   base = 1000 when the guessed district is the answer, otherwise 1000 × e^(−km / 150) (capped at 999)
//          km = great-circle distance between the two districts' anchor points (inside each district)
//   h    = 1.0 / 0.8 / 0.6 / 0.4 for 1 / 2 / 3 / 4 cards opened · timeout = 0

const MULTIPLIERS = [1.0, 0.8, 0.6, 0.4];      // cards opened: 1 (free), 2, 3, 4
const CORRECT_BASE = 1000;
const DISTANCE_SCALE_KM = 150;                  // 25 km ≈ 846 · 100 km ≈ 513 · 300 km ≈ 135
const DAILY_COUNT = 5;
const DAY0_UTC = Date.UTC(2026, 10, 5);         // day 0 of the daily rotation (Asia/Bangkok)

function multiplierFor(cardsOpened) {
  const n = Math.max(1, Math.min(MULTIPLIERS.length, cardsOpened | 0));
  return MULTIPLIERS[n - 1];
}

// Great-circle distance in km between [lat, lon] points.
function haversineKm(a, b) {
  const R = 6371.0088, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

function distanceBase(km) {
  if (km <= 0) return CORRECT_BASE;
  return Math.min(CORRECT_BASE - 1, Math.round(CORRECT_BASE * Math.exp(-km / DISTANCE_SCALE_KM)));
}

// One answered question → score breakdown. districts: { [id]: { ll: [lat, lon], … } }
function scoreAnswer({ question, guessId, cardsOpened, timedOut, districts }) {
  const h = multiplierFor(cardsOpened);
  if (timedOut || !guessId) return { correct: false, timeout: true, h, base: 0, score: 0, km: null };
  if (guessId === question.answer) return { correct: true, timeout: false, h, base: CORRECT_BASE, score: Math.round(CORRECT_BASE * h), km: 0 };
  const g = districts[guessId], a = districts[question.answer];
  if (!g || !a) return { correct: false, timeout: false, h, base: 0, score: 0, km: null };
  const km = haversineKm(g.ll, a.ll);
  const base = distanceBase(km);
  return { correct: false, timeout: false, h, base, score: Math.round(base * h), km };
}

const fmtKm = km => km == null ? '–' : km < 10 ? km.toFixed(1) : Math.round(km).toLocaleString('en-US');

// Calendar day in Thailand, as YYYY-MM-DD (daily set changes at midnight Asia/Bangkok).
function bangkokDate(d) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
}
function dayIndex(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - DAY0_UTC) / 86400000);
}
function bangkokDayStartMs(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return Date.UTC(y, m - 1, d) - 7 * 3600000;
}
// Same questions for everybody on a date. Questions pinned to the date come first, then the pool is walked in
// blocks of `count`, so nothing repeats until every question has been used. A question published during day D
// joins from D+1, so publishing in the team site never changes a day that has started. (No published_at = always.)
function dailySet(questions, dateStr, count) {
  count = count || DAILY_COUNT;
  const dayStart = bangkokDayStartMs(dateStr);
  const all = questions.slice().sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  const ready = all.filter(q => !q.published_at || Date.parse(q.published_at) < dayStart);
  const pool = ready.length ? ready : all;
  const out = pool.filter(q => q.schedule_date === dateStr).slice(0, count);
  const free = pool.filter(q => !q.schedule_date);
  const n = free.length;
  if (n) {
    const start = (((dayIndex(dateStr) * count) % n) + n) % n;
    for (let i = 0; out.length < count && i < n; i++) out.push(free[(start + i) % n]);
  }
  return out;
}

// 🎯 right district · 🟩 ≤ 25 km · 🟨 ≤ 100 km · 🟧 ≤ 300 km · 🟥 farther · ⬜ timeout
function distanceMark(r) {
  if (r.timeout) return '⬜';
  if (r.correct) return '🎯';
  return r.km <= 25 ? '🟩' : r.km <= 100 ? '🟨' : r.km <= 300 ? '🟧' : '🟥';
}
function shareText({ dateLabel, total, max, results, url }) {

<script>

        r.onsuccess = () => res(r.result);

    const db = await idb();
    if (!db) { if (mode === 'put') mem.set(key, val); if (mode === 'del') mem.delete(key); return mem.get(key); }
    return new Promise((res, rej) => {
      const tx = db.transaction('blobs', mode === 'get' ? 'readonly' : 'readwrite');
      const st = tx.objectStore('blobs');

  async function loadContent() {

      return { categories: CATEGORIES, source: 'demo',

  async function saveQuestion(q) {

    must(await c.from('questions').upsert({ id: q.id, category: q.category, status: q.status, data: q, verified_by: q.verified_by || null, verified_at: q.verified_at || null, updated_at: q.updated_at }));

  async function importSeed() {

    try { localStorage.removeItem(DEMO_KEY); } catch (e) { /* ignore */ }

    urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear();
    const db = await idb();
    if (db) await new Promise(res => { const tx = db.transaction('blobs', 'readwrite'); tx.objectStore('blobs').clear(); tx.oncomplete = res; tx.onerror = res; });
  }

  // Resize + re-encode in the browser: max 1600 px, JPEG. Re-encoding also drops EXIF (GPS, device).
  async function compressImage(file, maxSide, quality) {
    maxSide = maxSide || 1600; quality = quality || 0.85;
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      src = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => rej(new Error('เปิดไฟล์ภาพนี้ไม่ได้ ลองเลือกไฟล์ .jpg หรือ .png'));
        img.src = URL.createObjectURL(file);
      });
    }
    const w0 = src.width, h0 = src.height;
    if (Math.min(w0, h0) < 400) throw new Error('ภาพเล็กเกินไป (ด้านสั้นต้องอย่างน้อย 400 พิกเซล)');
    const k = Math.min(1, maxSide / Math.max(w0, h0));
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(src, 0, 0, w, h);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', quality));
    if (!blob) throw new Error('แปลงภาพไม่สำเร็จ');

function renderAside() {
  const aside = $('ad-aside');
  if (!aside || !A.E) return;
  const E = A.E, q = E.q;
  const built = buildQuestion();
  const req = requirements(built);
  const ready = req.every(r => r[1]);
  const needOk = req.filter(r => r[0] !== 'ผ่านการตรวจแล้ว').every(r => r[1]);
  const blocked = q.status === 'published' && !ready;
  aside.innerHTML = '';
  const status = h('div', { class: 'ad-status', role: 'radiogroup', 'aria-label': 'สถานะ' });
  [['draft', 'ร่าง — ยังไม่ขึ้นในเกม'], ['published', 'เผยแพร่ — ขึ้นในเกม'], ['archived', 'เก็บเข้าคลัง — ซ่อนจากเกม']].forEach(([v, t]) => {
    const dis = v === 'published' && !ready && q.status !== 'published';
    status.append(h('label', { class: dis ? 'dis' : '' }, h('input', { type: 'radio', name: 'ad-st', value: v, checked: q.status === v, disabled: dis, onchange: () => { q.status = v; A.dirty = true; renderAside(); } }), t));
  });
  const verify = q.verified_by
    ? h('div', { class: 'ad-verify done' }, h('b', { text: 'ตรวจแล้ว' }), h('span', { class: 'ad-small', text: 'โดย ' + q.verified_by + ' · ' + thTime(q.verified_at) }),
      btn('ยกเลิกการตรวจ', () => { q.verified_by = null; q.verified_at = null; touch(false); }, 'sm'))
    : h('div', { class: 'ad-verify' },
      E.stale ? h('p', { class: 'ad-err', text: 'แก้เนื้อหาหลังตรวจแล้ว ต้องยืนยันการตรวจใหม่' }) : null,
      h('p', { class: 'ad-small ad-muted', text: 'ตรวจข้อเท็จจริงกับแหล่งที่มา ตรวจสัญญาอนุญาตภาพ และอ่านเบาะแสว่าไม่กำกวม' }),
      btn('ฉันตรวจครบแล้ว', () => { q.verified_by = reviewerName(); q.verified_at = new Date().toISOString(); E.stale = false; A.dirty = true; renderAside(); }, 'ok', { disabled: !needOk, title: needOk ? '' : 'กรอกข้อมูลให้ครบก่อน' }));
  aside.append(
    h('div', { class: 'ad-card ad-stack' }, h('h3', { text: 'ก่อนเผยแพร่' }),
      h('ul', { class: 'ad-checks' }, req.map(([t, ok]) => h('li', { class: ok ? 'ok' : '', text: t }))), verify),
    h('div', { class: 'ad-card ad-stack' }, h('h3', { text: 'สถานะ' }), status,
      field('วันที่กำหนด (ไม่บังคับ)', inp(q.schedule_date || '', v => { q.schedule_date = v || null; A.dirty = true; }, { type: 'date' }), 'ล็อกให้ข้อนี้เป็นข้อรายวันของวันนั้น'),
      field('หมายเหตุภายใน', area(q.note || '', v => { q.note = v; A.dirty = true; }, { rows: 2 }))),
    h('div', { class: 'ad-card ad-stack' },
      btn(E.isNew ? 'บันทึกคำถาม' : 'บันทึกการแก้ไข', saveEditor, 'primary', { disabled: blocked }),
      blocked ? h('p', { class: 'ad-err', text: 'ข้อนี้ตั้งเป็นเผยแพร่: ต้องครบทุกข้อและกด “ฉันตรวจครบแล้ว” ก่อนบันทึก หรือเปลี่ยนเป็นร่างเพื่อเก็บงานไว้ก่อน' })
        : h('p', { class: 'ad-help', text: q.status === 'published' ? (q.published_at ? 'บันทึกแล้วผู้เล่นเห็นเนื้อหาใหม่ทันที' : 'บันทึกแล้วขึ้นในโหมดไม่จำกัด และเข้ารอบรายวันตั้งแต่พรุ่งนี้') : 'บันทึกเป็น' + STATUS_TH[q.status] + ' ผู้เล่นยังไม่เห็น' })));
}
async function saveEditor() {
  const E = A.E;
  const q = buildQuestion();
  if (!q.topic && !q.answer) { toast('ใส่หัวข้อหรือคำตอบก่อนบันทึก'); return; }
  if (q.status === 'published' && !requirements(q).every(r => r[1])) { toast('ยังไม่ครบเงื่อนไขเผยแพร่'); return; }
  if (E.isNew && A.questions.some(x => x.id === q.id)) q.id = nextId(q.category);
  const saved = await guard(() => BE.saveQuestion(q), 'บันทึกแล้ว');
  if (!saved) return;
  A.dirty = false;
  A.questions = await BE.listQuestions();
  const fresh = A.questions.find(x => x.id === saved.id) || saved;
  openEditor(clone(fresh), false);
}
async function removeQuestion(q) {
  if (!await confirmBox('ลบคำถาม ' + q.id + '?', q.status === 'published' ? 'ข้อนี้เผยแพร่อยู่ จะหายจากเกมทันที ' + 'ถ้าแค่อยากซ่อน ให้เปลี่ยนสถานะเป็น “เก็บเข้าคลัง” แทน' : 'ลบถาวร ย้อนกลับไม่ได้', 'ลบถาวร', 'danger')) return;
  await guard(async () => { await BE.deleteQuestion(q.id); A.dirty = false; A.questions = await BE.listQuestions(); setView('questions'); }, 'ลบแล้ว');
}
async function copyJSON(obj) {
  const text = JSON.stringify(obj, null, 1);
  try { await navigator.clipboard.writeText(text); toast('คัดลอก JSON แล้ว'); }
  catch (e) { dialog('JSON', [h('textarea', { class: 'ad-in', rows: 16, value: text, readonly: true })]); }
}

/* ---------------- 4. ระบบ ---------------- */
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

      : h('p', { text: 'โหมดสาธิต: ไม่มีเซิร์ฟเวอร์ ข้อมูลและภาพเก็บใน localStorage/IndexedDB ของเบราว์เซอร์นี้ เว็บเล่นเกมกับเว็บใส่ข้อมูลเห็นข้อมูลเดียวกันเมื่อเปิดจากที่อยู่เดียวกันในเบราว์เซอร์นี้' }),
    live ? null : h('p', { class: 'ad-help', text: 'ใช้งานจริง: ใส่ supabaseUrl และ supabaseKey (publishable key) ในไฟล์ config.js ของทั้งสองเว็บ (ดู README ขั้นที่ 4)' })));
  main.append(h('div', { class: 'ad-card ad-stack' }, h('h3', { text: 'ข้อมูลตั้งต้น' }),

    h('div', { class: 'ad-bar' }, live
      ? btn('นำเข้าข้อมูลตั้งต้น', async () => { if (!await confirmBox('นำเข้าข้อมูลตั้งต้น?', 'ไม่เขียนทับรายการที่มีอยู่แล้ว')) return; await guard(async () => { await BE.importSeed(); await loadAll(); setView('system'); }, 'นำเข้าแล้ว'); }, 'primary')

/* ---------------- mount ---------------- */
async function mount() {
  $('admin-app').hidden = false;
  if (A.mounted) {
    if (A.session && A.session.admin && A.view !== 'editor') await guard(async () => { await loadAll(); setView(A.view); });
    return;
  }
  A.mounted = true;
  shell();
  try { A.session = await BE.session(); }
  catch (e) { $('ad-main').innerHTML = ''; $('ad-main').append(h('div', { class: 'ad-card ad-login' }, h('h2', { text: 'เชื่อมต่อไม่สำเร็จ' }), h('p', { text: String(e.message || e) }))); A.mounted = false; return; }
  await guard(afterSession);
}
return { mount };
